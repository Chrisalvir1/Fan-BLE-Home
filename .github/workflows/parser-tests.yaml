name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-homeassistant pyserial-custom-component homeassistant pyserial
      - name: Run pytest
        run: pytest tests/ -v
      - name: Check Python syntax
        run: python -m compileall -q custom_components/fan_ble_home
