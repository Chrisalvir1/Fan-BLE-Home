start_study:
  name: Start BLE Study
  description: Start a temporary, passive BLE observation session.
  fields:
    duration:
      name: Duration
      description: Session duration in seconds.
      required: false
      example: 60
      selector:
        number:
          min: 10
          max: 300
          step: 1
    sensitivity:
      name: Sensitivity
      description: strict (only candidates) or research (all metadata).
      required: false
      example: strict
      selector:
        select:
          options:
            - strict
            - research

stop_study:
  name: Stop BLE Study
  description: Manually stop the active BLE observation session.
