start_study:
  name: Start BLE study
  description: Observe BLE advertisement changes temporarily. No decoding or fan control yet. The session is shared across all Fan BLE Home entries.
  fields:
    duration:
      name: Duration
      description: Seconds to listen before stopping automatically.
      default: 60
      selector:
        number:
          min: 10
          max: 300
          step: 1
          mode: box
stop_study:
  name: Stop BLE study
  description: Stop the shared BLE observation session immediately.
